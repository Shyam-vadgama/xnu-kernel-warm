# devices/warm/device.conf: Xiaomi Redmi A4 5G (SM4635).

device warm
	title       Redmi A4 5G
	vendor      Xiaomi
	soc         sm4635
	defconfig   warm_defconfig
	firmware    pull-firmware.sh
	maintainer  HakiOS Warm
	status      display     works     UEFI GOP framebuffer (0x82d00000, 720x1640)
	status      cpu         partial   boots XNU & /sbin/launchd on bootcpu=7 cpus=1
	status      storage     partial   4096B 6-LUN UFS at ufshc@4804000 (WarmUfsHcDxe + SMMU wired, flash probe in testing)
	status      buttons     missing   not ported yet
	status      touch       missing   not ported yet
	status      gpu         missing   Adreno 611 (0x06010100)
	status      audio       missing   not ported yet
	status      battery     missing   not ported yet
	status      haptic      missing   not ported yet
	status      camera      missing   not ported yet
	status      torch       missing   not ported yet
	status      wifi        missing   not ported yet
	status      bluetooth   missing   not ported yet
	status      cellular    partial   SM4635 MPSS/IPA addresses recorded in soc.args
	status      network     missing   not ported yet
	status      thermal     missing   not ported yet
	status      usb         partial   polled DWC3 WarmUsbDeviceDxe (0x04e00000) + GCC clock init in testing
	status      sensors     missing   not ported yet
